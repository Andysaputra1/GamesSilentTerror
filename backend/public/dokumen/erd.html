<style>
/* Layout: satu kolom; kepala halaman ringkas, lalu satu lembar gambar teknik yang bisa di-zoom dan digeser. */
:root {
  --bg: #EBEFF3;
  --surface: #FFFFFF;
  --ink: #1B2430;
  --muted: #5A6574;
  --line: #CDD5DE;
  --accent: #2F5E8C;
  --on-accent: #FFFFFF;
  --paper: #FFFFFF;
  --display: Georgia, 'Times New Roman', serif;
  --body: 'Segoe UI', system-ui, Arial, sans-serif;
  --mono: Consolas, 'Cascadia Mono', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --surface: #18202A; --ink: #E3E9F0; --muted: #98A4B3; --line: #2C3744;
    --accent: #8DB4DF; --on-accent: #0F141A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --surface: #18202A; --ink: #E3E9F0; --muted: #98A4B3; --line: #2C3744;
  --accent: #8DB4DF; --on-accent: #0F141A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1900px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 36px; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
header > div { min-width: 0; }
h1 { font: 600 clamp(26px, 3.2vw, 36px)/1.1 var(--display); margin: 0; text-wrap: balance; }
.meta { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.meta code { font-family: var(--mono); font-size: 12px; }
.zoom { display: flex; gap: 6px; align-items: center; }
.zoom > span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.zoom button { font: 600 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.zoom button:hover { border-color: var(--accent); }
.zoom button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-width: 100%; }
.sheet svg { display: block; height: auto; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
</style>

<script>
(() => {
  const svg = document.querySelector('#sheet svg');
  const buttons = [...document.querySelectorAll('[data-zoom]')];
  const apply = (zoom) => {
    svg.style.width = zoom === 'fit' ? '100%' : 1887 * Number(zoom) + 'px';
    buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.zoom === zoom)));
    try { localStorage.setItem('erd-zoom', zoom); } catch {}
  };
  let start = null;
  try { start = localStorage.getItem('erd-zoom'); } catch {}
  if (!buttons.some((b) => b.dataset.zoom === start)) start = window.innerWidth >= 1100 ? 'fit' : '1';
  buttons.forEach((b) => b.addEventListener('click', () => apply(b.dataset.zoom)));
  apply(start);
})();
</script>
