<div class="card-container">
  <!-- Lapis 1: bingkai kartu (selalu tampil). -->
  <img [src]="frameUrl" alt="Role Card" class="card-frame" />

  <!-- Lapis 2: jendela potret berisi skin dan properti. -->
  <div
    class="portrait-window"
    [class.portrait-window--skin-fading-out]="skinTransition === 'out'"
    [class.portrait-window--skin-fading-in]="skinTransition === 'in'"
  >
    <!-- Gambar skin. -->
    <img [src]="skinUrl" alt="Avatar" class="skin-img" />

    <!-- Properti di atas skin, hanya bila role punya properti. -->
    @if (propUrl) {
      <img [src]="propUrl!" alt="Role Prop" class="prop-overlay" />
    }
  </div>
</div>
