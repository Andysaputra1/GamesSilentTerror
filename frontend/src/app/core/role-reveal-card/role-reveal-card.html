<div class="card-container">
  <!-- Layer 1: Card frame (always render) -->
  <img [src]="frameUrl()" alt="Role Card" class="card-frame" />

  <!-- Layer 2: Portrait window containing skin + prop -->
  <div class="portrait-window">
    <!-- Skin image -->
    <img [src]="skinUrl()" alt="Avatar" class="skin-img" />

    <!-- Prop overlay (only render if role has a prop) -->
    @if (propUrl()) {
      <img [src]="propUrl()!" alt="Role Prop" class="prop-overlay" />
    }
  </div>
</div>
