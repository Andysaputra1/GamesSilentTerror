@if (available()) {
  <div class="fullscreen-control">
    <button
      type="button"
      class="fullscreen-toggle"
      (click)="toggleFullscreen()"
      [disabled]="pending()"
      [attr.aria-pressed]="active()"
      [attr.aria-label]="active() ? 'Keluar dari layar penuh' : 'Masuk layar penuh'"
      [title]="active() ? 'Keluar layar penuh' : 'Layar penuh'"
    >
      <span aria-hidden="true">{{ active() ? '⤢' : '⛶' }}</span>
      <span class="fullscreen-label">{{ pending() ? '…' : active() ? 'Keluar' : 'Layar penuh' }}</span>
    </button>
    @if (error()) {
      <span class="fullscreen-error" role="status">{{ error() }}</span>
    }
  </div>
}
