<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Silent Terror</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#2a170c" />
    <!-- Gambar layar loading diminta sejak awal; semuanya juga dipakai halaman login/main. -->
    <link rel="preload" as="image" href="/assets/backgrounds/backwood.jpg" />
    <link rel="preload" as="image" href="/assets/buttons/btn-wood.png" />
    <link rel="preload" as="image" href="/assets/characters/loader-cast.webp" type="image/webp" />
  </head>
  <body>
    <!-- Layar loading awal: tampil pada paint pertama (prerender maupun build statis) dan
         dihapus oleh core/boot-loader.ts setelah halaman pertama, font, dan gambarnya siap.
         Gaya sama dengan halaman login: meja kayu, papan judul berpaku, dan kertas krem. -->
    <div id="boot-loader" class="boot-loader" role="status" aria-live="polite">
      <div class="boot-loader__board">
        <p class="boot-loader__title">Silent <span aria-hidden="true">◆</span> Terror</p>
        <p class="boot-loader__tagline">Social Deduction Party Game</p>
      </div>
      <!-- Enam karakter skin game berbaris; kaca pembesar menyisir mencari Hitman. -->
      <div class="boot-loader__lineup" aria-hidden="true">
        <span style="--i: 0"></span><span style="--i: 1"></span><span style="--i: 2"></span
        ><span style="--i: 3"></span><span style="--i: 4"></span><span style="--i: 5"></span>
        <i class="boot-loader__lens"></i>
      </div>
      <p class="boot-loader__hint">Menyiapkan meja<b>.</b><b>.</b><b>.</b></p>
    </div>
    <app-root></app-root>
  </body>
</html>
