<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Silent Terror</title>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d494"/>
      <stop offset=".45" stop-color="#b9844a"/>
      <stop offset="1" stop-color="#5a3517"/>
    </linearGradient>
    <radialGradient id="paper" cx=".5" cy=".38" r=".7">
      <stop offset="0" stop-color="#f8eed8"/>
      <stop offset="1" stop-color="#dcc297"/>
    </radialGradient>
    <clipPath id="field">
      <circle cx="64" cy="64" r="51"/>
    </clipPath>
  </defs>

  <!-- medali kuningan -->
  <circle cx="64" cy="64" r="62" fill="url(#brass)"/>
  <circle cx="64" cy="64" r="55" fill="#2a170c"/>
  <circle cx="64" cy="64" r="51" fill="url(#paper)"/>

  <g clip-path="url(#field)">
    <g transform="translate(64 64) scale(1.14) translate(-64 -61)">
      <!-- bahu & mantel -->
      <path d="M22 124c2-22 18-33 42-33s40 11 42 33z" fill="#201d19"/>
      <path d="M52 92l12 22 12-22" fill="none" stroke="#4a3d31" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- leher & kepala dalam bayangan -->
      <rect x="57" y="78" width="14" height="16" fill="#2c2520"/>
      <ellipse cx="64" cy="70" rx="15.5" ry="17.5" fill="#2c2520"/>
      <!-- topi fedora -->
      <path d="M45 57c1-14 5-25 12-26 3 3 11 3 14 0 7 1 11 12 12 26z" fill="#201d19"/>
      <path d="M46.2 46h35.6l.7 7H45.5z" fill="#9b3b2a"/>
      <ellipse cx="64" cy="57.5" rx="31" ry="6.5" fill="#201d19"/>
      <!-- mata menyala di balik bayangan topi -->
      <path d="M53 66.5q4.5-3 9 0q-4.5 1.8-9 0zM66 66.5q4.5-3 9 0q-4.5 1.8-9 0z" fill="#f3cf7a"/>
      <!-- lakban gag order -->
      <g fill="#ead7ad" stroke="#a88a58" stroke-width="1">
        <rect x="51" y="73" width="26" height="6.5" rx="1" transform="rotate(-16 64 76.25)"/>
        <rect x="51" y="73" width="26" height="6.5" rx="1" transform="rotate(16 64 76.25)"/>
      </g>
    </g>
  </g>

  <circle cx="64" cy="64" r="51" fill="none" stroke="#2a170c" stroke-width="1.5"/>
</svg>
