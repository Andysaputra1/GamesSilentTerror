# Versi NVIDIA: docker compose -f docker-compose.gpu.yml up -d --build
# File mandiri, bukan override. Jangan jalankan bersamaan dengan versi CPU.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: shadow_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-2048}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-10m}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shadow-net

  # One-shot initializer: downloads missing models after the server is ready.
  # Existing models stay in ollama_data, so subsequent up commands skip them.
  ollama-models:
    image: ollama/ollama:latest
    restart: "on-failure:3"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODELS_TO_PULL: "${OLLAMA_MODELS_TO_PULL:-qwen3:8b qwen3:14b}"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for model in $$OLLAMA_MODELS_TO_PULL; do
          if ollama show "$$model" >/dev/null 2>&1; then
            echo "Model available: $$model"
          else
            ollama pull "$$model"
          fi
        done
    networks:
      - shadow-net

  ai-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadow_python_backend
    expose:
      - "8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AI_PROVIDER: "${AI_PROVIDER:-api}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-8}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-180}"
      OLLAMA_MAX_OUTPUT_TOKENS: "${OLLAMA_MAX_OUTPUT_TOKENS:-160}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-2048}"
      openai_api_env: "${openai_api_env:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5-mini}"
      OPENAI_REASONING_EFFORT: "${OPENAI_REASONING_EFFORT:-minimal}"
      OPENAI_MAX_OUTPUT_TOKENS: "${OPENAI_MAX_OUTPUT_TOKENS:-320}"
      AUTH_SESSION_HOURS: "${AUTH_SESSION_HOURS:-24}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: shadow_heist
      MYSQL_USER: "${MYSQL_USER:-shadow_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-shadow_app_dev_2026}"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shadow-net

  mysql:
    image: mysql:8.4.11
    container_name: shadow_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: shadow_heist
      MYSQL_USER: ${MYSQL_USER:-shadow_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shadow_app_dev_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shadow_root_dev_2026}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - shadow-net

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: shadow_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-http://localhost:8000/phpmyadmin/}
      UPLOAD_LIMIT: 32M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shadow-net

  gateway:
    image: nginx:1.31.4-alpine3.24
    container_name: shadow_gateway
    ports:
      - "8000:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ai-engine:
        condition: service_started
      phpmyadmin:
        condition: service_started
    networks:
      - shadow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shadow_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public:ro
    depends_on:
      - ai-engine
    networks:
      - shadow-net

networks:
  shadow-net:
    driver: bridge

volumes:
  ollama_data:
    # Reuse this project's existing model data across container recreation.
    name: games_ollama_data
  mysql_data:
    name: shadow_heist_mysql_data
