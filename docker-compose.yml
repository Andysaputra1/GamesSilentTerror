services:
  mysql:
    image: mysql:8.4.11
    container_name: shadow_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: shadow_heist
      MYSQL_USER: ${MYSQL_USER:-shadow_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shadow_app_dev_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shadow_root_dev_2026}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - shadow-net

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: shadow_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-http://localhost:8000/phpmyadmin/}
      UPLOAD_LIMIT: 32M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shadow-net

  ai-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadow_python_backend
    expose:
      - "8000"
    environment:
      # The secret exists only on the backend container; it is never sent to Angular.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Compatibility for a local .env that already uses this variable name.
      - openai_api_env=${openai_api_env:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-mini}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-minimal}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-320}
      - AUTH_SESSION_HOURS=${AUTH_SESSION_HOURS:-24}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=shadow_heist
      - MYSQL_USER=${MYSQL_USER:-shadow_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-shadow_app_dev_2026}
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shadow-net

  gateway:
    image: nginx:1.31.4-alpine3.24
    container_name: shadow_gateway
    ports:
      - "8000:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ai-engine:
        condition: service_started
      phpmyadmin:
        condition: service_started
    networks:
      - shadow-net

  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    container_name: shadow_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - ai-engine
    networks:
      - shadow-net

networks:
  shadow-net:
    driver: bridge

volumes:
  mysql_data:
    # Named explicitly so old experiments using "games_mysql_data" cannot make
    # MySQL skip this project's migrations or retain unknown credentials.
    name: shadow_heist_mysql_data
