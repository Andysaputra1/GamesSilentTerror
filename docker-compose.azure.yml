# Azure: persistent MySQL + single-worker backend + automatic HTTPS.
name: silent-terror-azure
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: shadow_heist
      MYSQL_USER: shadow_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.azure}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.azure}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/deployment/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost --silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    build:
      context: ./backend
      dockerfile: deployment/Dockerfile.azure
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: production
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: shadow_heist
      MYSQL_USER: shadow_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.azure}
      CORS_ORIGINS: ${FRONTEND_ORIGIN:-https://silent-terror.andylabs.site}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PANEL_USERNAME: administrator
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH:-}
      PANEL_ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY:-}
      AI_PROVIDER: api
      API_BACKEND: openrouter
      OPENROUTER_DEFAULT: ${openrouter_default:-${OPENROUTER_DEFAULT:-}}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_MODEL: '14'
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_TUNNEL_TOKEN: ${OLLAMA_TUNNEL_TOKEN:-}
      INTENT_MODEL_PATH: /models/intent_classifier.pkl
      DATABASE_POOL_SIZE: '5'
      DATABASE_MAX_OVERFLOW: '5'
      SQL_ECHO: 'false'
    volumes:
      - ./backend/artifacts/svm:/models:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import json,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5)); assert s['ready']",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-backendthesis.andylabs.site}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./backend/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

# Database and backend have no published host ports.
volumes:
  mysql_data:
    external: true
    name: shadow_heist_mysql_data
  caddy_data:
  caddy_config:
